<template>
  <lightning-card title="Chatbot Conversation Analytics" icon-name="standard:bot">
    <div class="slds-p-horizontal_medium subtitle">Agentforce-powered analysis of customer conversations, bot resolution effectiveness, and human escalation <span class="sample">POC analytics based on {summary.totalConversations} sample conversations</span></div>
    <div class="slds-p-horizontal_medium filters">
      <lightning-input name="analyzedFrom" type="date" label="Analyzed from" value={filters.analyzedFrom} onchange={handleFilter}></lightning-input>
      <lightning-input name="analyzedTo" type="date" label="Analyzed to" value={filters.analyzedTo} onchange={handleFilter}></lightning-input>
      <lightning-combobox name="botResolutionStatus" label="Bot Resolution Status" value={filters.botResolutionStatus} options={statusOptions} onchange={handleFilter}></lightning-combobox>
      <lightning-combobox name="escalatedToHuman" label="Escalated to Human" value={filters.escalatedToHuman} options={booleanOptions} onchange={handleFilter}></lightning-combobox>
      <lightning-combobox name="finalResolutionBy" label="Final Resolution" value={filters.finalResolutionBy} options={finalOptions} onchange={handleFilter}></lightning-combobox>
      <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh" onclick={handleRefresh}></lightning-button-icon>
    </div>
    <template if:true={error}><div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div></template>
    <template if:true={hasRows}>
      <div class="slds-p-around_medium kpis">
        <div class="kpi"><span>Total analyzed</span><strong>{summary.totalConversations}</strong></div><div class="kpi"><span>Bot resolved</span><strong>{summary.botResolvedCount}</strong><small>{summary.botResolvedPercent}%</small></div><div class="kpi"><span>Partially resolved</span><strong>{summary.partiallyResolvedCount}</strong><small>{summary.partiallyResolvedPercent}%</small></div><div class="kpi"><span>Bot not resolved</span><strong>{summary.botNotResolvedCount}</strong><small>{summary.botNotResolvedPercent}%</small></div><div class="kpi"><span>Escalated to human</span><strong>{summary.escalatedCount}</strong><small>{summary.escalatedPercent}%</small></div><div class="kpi"><span>Resolved by human</span><strong>{summary.humanResolvedCount}</strong><small>{summary.humanResolvedPercent}%</small></div><div class="kpi"><span>Unresolved</span><strong>{summary.unresolvedCount}</strong><small>{summary.unresolvedPercent}%</small></div><div class="kpi"><span>Average confidence</span><strong><lightning-formatted-number value={summary.averageConfidence} maximum-fraction-digits="2"></lightning-formatted-number></strong></div>
      </div>
      <div class="slds-p-horizontal_medium chart-grid"><section><h2>Bot Resolution Status</h2><template for:each={statusBars} for:item="bar"><div key={bar.label} class="chart-row"><span>{bar.label} ({bar.count})</span><div class="track"><div class={bar.className} style={bar.style}></div></div><b>{bar.percent}%</b></div></template></section><section><h2>Conversation Escalation</h2><template for:each={escalationBars} for:item="bar"><div key={bar.label} class="chart-row"><span>{bar.label} ({bar.count})</span><div class="track"><div class={bar.className} style={bar.style}></div></div><b>{bar.percent}%</b></div></template><h2>Final Resolution By</h2><template for:each={finalBars} for:item="bar"><div key={bar.label} class="chart-row"><span>{bar.label} ({bar.count})</span><div class="track"><div class={bar.className} style={bar.style}></div></div><b>{bar.percent}%</b></div></template></section></div>
      <div class="slds-p-around_medium"><h2>Top Customer Intents</h2><ul class="intent-list"><template for:each={rows} for:item="row"><li key={row.conversationRecordId}><b>{row.customerIntent}</b> — {row.customerProblem}</li></template></ul></div>
      <div class="slds-p-around_medium table-wrap"><h2>Conversation Analysis</h2><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th>Conversation</th><th>Customer Problem</th><th>Intent</th><th>Bot Resolution</th><th>Escalated</th><th>Final Resolution</th><th>Confidence</th><th>Analysis Summary</th><th>Analyzed</th></tr></thead><tbody><template for:each={rows} for:item="row"><tr key={row.conversationRecordId}><td><button class="link" data-id={row.conversationRecordId} onclick={handleDetail}>{row.conversationIdentifier}</button></td><td>{row.customerProblem}</td><td>{row.customerIntent}</td><td>{row.botResolutionStatus}</td><td><lightning-formatted-text value={row.escalatedToHuman}></lightning-formatted-text></td><td>{row.finalResolutionBy}</td><td><lightning-formatted-number value={row.confidence} maximum-fraction-digits="2"></lightning-formatted-number></td><td>{row.analysisSummary}</td><td><lightning-formatted-date-time value={row.analyzedAt}></lightning-formatted-date-time></td></tr></template></tbody></table></div>
      <div class="slds-p-around_medium table-wrap"><h2>Bot Failure Reasons</h2><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th>Conversation</th><th>Intent</th><th>Bot Resolution</th><th>Bot Failure Reason</th><th>Escalated</th><th>Final Resolution</th></tr></thead><tbody><template for:each={rows} for:item="row"><tr key={row.conversationIdentifier}><td>{row.conversationIdentifier}</td><td>{row.customerIntent}</td><td>{row.botResolutionStatus}</td><td>{row.botFailureReason}</td><td>{row.escalatedToHuman}</td><td>{row.finalResolutionBy}</td></tr></template></tbody></table></div>
    </template><template if:false={hasRows}><div class="slds-p-around_large empty">No analyzed conversations match the selected filters.</div></template>
  </lightning-card>
  <template if:true={showDetail}><section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open"><div class="slds-modal__container"><header class="slds-modal__header"><lightning-button-icon class="slds-modal__close" icon-name="utility:close" alternative-text="Close" onclick={closeDetail}></lightning-button-icon><h2>Conversation Analysis: {selectedDetail.conversationIdentifier}</h2></header><div class="slds-modal__content slds-p-around_medium"><button class="link" onclick={openRecord}>Open Salesforce conversation record</button><div class="detail-grid"><p><b>Start:</b> <lightning-formatted-date-time value={selectedDetail.startTimestamp}></lightning-formatted-date-time></p><p><b>End:</b> <lightning-formatted-date-time value={selectedDetail.endTimestamp}></lightning-formatted-date-time></p><p><b>Messages:</b> {selectedDetail.messageCount}</p><p><b>Status:</b> {selectedDetail.conversationStatus}</p><p><b>Human agent:</b> {selectedDetail.hasHumanAgent}</p><p><b>Bot outcome:</b> {selectedDetail.botResolutionStatus}</p><p><b>Final resolution:</b> {selectedDetail.finalResolutionBy}</p><p><b>Confidence:</b> {selectedDetail.confidence}</p></div><h3>Customer Problem</h3><p>{selectedDetail.customerProblem}</p><h3>Customer Intent</h3><p>{selectedDetail.customerIntent}</p><h3>Bot Failure Reason</h3><p>{selectedDetail.botFailureReason}</p><h3>Analysis Summary</h3><p>{selectedDetail.analysisSummary}</p><h3>Evidence</h3><p>{selectedDetail.evidence}</p><h3>Original Transcript</h3><pre class="transcript">{selectedDetail.transcript}</pre><h3>Raw Message Audit Trail</h3><table class="slds-table slds-table_cell-buffer slds-table_bordered"><thead><tr><th>Row</th><th>Participant</th><th>Role</th><th>Category</th><th>Message</th><th>Options</th><th>Source time</th></tr></thead><tbody><template for:each={selectedDetail.messages} for:item="message"><tr key={message.rowNumber}><td>{message.rowNumber}</td><td>{message.participantDisplayName}</td><td>{message.participantRole}</td><td>{message.messageCategory}</td><td>{message.messageText}</td><td>{message.availableOptions}</td><td>{message.clientTimestampRaw}</td></tr></template></tbody></table></div></div></section><div class="slds-backdrop slds-backdrop_open"></div></template>
</template>
